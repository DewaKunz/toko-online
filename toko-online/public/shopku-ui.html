<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopKu — Toko Online</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F5F5}
  .sk-btn{background:#EE4D2D;color:white;border:none;padding:10px 20px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;transition:opacity .15s}
  .sk-btn:hover{opacity:.88}.sk-btn:disabled{opacity:.55;cursor:default}
  .sk-outline{background:transparent;color:#EE4D2D;border:1.5px solid #EE4D2D;padding:9px 20px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer}
  .sk-outline:hover{background:#FFF0EE}
  .prod-card{background:white;border-radius:8px;border:1px solid #eee;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .prod-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
  .tab-btn{padding:8px 18px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
  .tab-on{background:#EE4D2D;color:white}.tab-off{background:transparent;color:#666}
  .tab-off:hover{background:#f5f5f5}
  .fi{width:100%;box-sizing:border-box;padding:9px 12px;border-radius:8px;border:1.5px solid #E0E0E0;font-size:14px;font-family:inherit}
  .fi:focus{outline:none;border-color:#EE4D2D}
  .sp{background:#FEF3C7;color:#92400E;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .ss{background:#D1FAE5;color:#065F46;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .sc{background:#FEE2E2;color:#991B1B;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .nav-lnk{background:none;border:none;color:white;font-size:12px;cursor:pointer;padding:5px 8px;border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.9;transition:opacity .15s;position:relative;font-family:inherit}
  .nav-lnk:hover{opacity:1;background:rgba(255,255,255,.15)}
  th{text-align:left;padding:10px 14px;font-weight:700;font-size:12px;color:#666;border-bottom:1px solid #eee;background:#fafafa}
  td{padding:11px 14px;border-bottom:1px solid #f5f5f5;color:#333;font-size:13px}
  table{width:100%;border-collapse:collapse}
  label{font-size:12px;font-weight:700;color:#666;display:block;margin-bottom:5px}
  textarea.fi{resize:vertical;height:64px}
  select.fi{appearance:none}
  input:focus,textarea:focus{outline:none;border-color:#EE4D2D !important}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect} = React;
const API = "http://127.0.0.1:8000/api";

const req = async(path,opts={},token=null)=>{
  const res = await fetch(API+path,{...opts,headers:{"Content-Type":"application/json","Accept":"application/json",...(token?{Authorization:`Bearer ${token}`}:{}),...(opts.headers||{})}});
  const j = await res.json();
  if(!res.ok) throw j;
  return j;
};

const idr = n => "Rp "+Number(n).toLocaleString("id-ID");

const CATS=[
  {name:"Elektronik",icon:"ti-device-mobile"},{name:"Fashion",icon:"ti-hanger"},
  {name:"Makanan",icon:"ti-salad"},{name:"Olahraga",icon:"ti-ball-football"},
  {name:"Kecantikan",icon:"ti-sparkles"},{name:"Rumah",icon:"ti-home-2"},
  {name:"Sepatu",icon:"ti-shoe"},{name:"Mainan",icon:"ti-puzzle"}
];

const emoji=(cat)=>({Elektronik:"📱",Fashion:"👗",Makanan:"🍔",Olahraga:"⚽",Kecantikan:"💄",Rumah:"🏠",Sepatu:"👟",Mainan:"🧸"}[cat]||"📦");

function App(){
  const [pg,setPg]=useState("home");
  const [token,setToken]=useState(null);
  const [user,setUser]=useState(null);
  const [prods,setProds]=useState([]);
  const [users,setUsers]=useState([]);
  const [txs,setTxs]=useState([]);
  const [cart,setCart]=useState([]);
  const [sel,setSel]=useState(null);
  const [notif,setNotif]=useState(null);
  const [loading,setLoad]=useState(false);
  const [search,setSearch]=useState("");
  const [atab,setAtab]=useState("products");
  const [showForm,setShowForm]=useState(false);
  const [editP,setEditP]=useState(null);
  const [pf,setPf]=useState({name:"",description:"",price:"",stock:"",category:""});
  const [af,setAf]=useState({name:"",email:"",password:"",password_confirmation:""});
  const [afErr,setAfErr]=useState("");

  const notifShow=(msg,err)=>{setNotif({msg,err});setTimeout(()=>setNotif(null),3500)};
  const go=(p)=>{setPg(p);setAfErr("");window.scrollTo(0,0);if(p==="admin"){loadProds();loadUsers();loadTxs();}if(p==="orders")loadTxs();};
  const loadProds=async(tk=token)=>{if(!tk)return;try{const d=await req("/products",{},tk);setProds(d.data||[]);}catch(e){console.error(e);}};
  const loadUsers=async()=>{try{const d=await req("/users",{},token);setUsers(d.data||[]);}catch(e){}};
  const loadTxs=async()=>{try{const d=await req("/transactions",{},token);setTxs(d.data||[]);}catch(e){}};
  useEffect(()=>{if(token)loadProds(token);},[token]);

  const doLogin=async(e)=>{
    e.preventDefault();setAfErr("");setLoad(true);
    try{const d=await req("/login",{method:"POST",body:JSON.stringify({email:af.email,password:af.password})});setToken(d.token);setUser(d.data);notifShow("Selamat datang! 🎉");go("home");}
    catch(e){setAfErr(e.message||"Email atau password salah");}finally{setLoad(false);}
  };
  const doReg=async(e)=>{
    e.preventDefault();setAfErr("");setLoad(true);
    try{const d=await req("/register",{method:"POST",body:JSON.stringify(af)});setToken(d.token);setUser(d.data);notifShow("Akun dibuat! 🎉");go("home");}
    catch(e){setAfErr(e.message||"Registrasi gagal");}finally{setLoad(false);}
  };
  const doLogout=async()=>{try{await req("/logout",{method:"POST"},token);}catch{}setToken(null);setUser(null);setCart([]);go("home");notifShow("Sampai jumpa! 👋");};
  const addCart=(prod)=>{
    if(prod.stock===0){notifShow("Stok habis!",true);return;}
    setCart(prev=>{const ex=prev.find(i=>i.id===prod.id);if(ex)return prev.map(i=>i.id===prod.id?{...i,qty:Math.min(i.qty+1,prod.stock)}:i);return[...prev,{...prod,qty:1}];});
    notifShow("Ditambahkan ke keranjang! 🛒");
  };
  const remCart=(id)=>setCart(c=>c.filter(i=>i.id!==id));
  const setQty=(id,qty)=>qty<1?remCart(id):setCart(c=>c.map(i=>i.id===id?{...i,qty}:i));
  const checkout=async()=>{
    if(!user){go("login");return;}setLoad(true);
    try{for(const it of cart)await req("/transactions",{method:"POST",body:JSON.stringify({user_id:user.id,product_id:it.id,quantity:it.qty})},token);
    setCart([]);notifShow("Pesanan berhasil! ✅");go("orders");loadProds();}
    catch(e){notifShow(e.message||"Checkout gagal",true);}finally{setLoad(false);}
  };
  const saveProd=async(e)=>{
    e.preventDefault();setLoad(true);
    try{if(editP)await req(`/products/${editP.id}`,{method:"PUT",body:JSON.stringify(pf)},token);
    else await req("/products",{method:"POST",body:JSON.stringify(pf)},token);
    notifShow(editP?"Produk diperbarui!":"Produk ditambahkan!");setShowForm(false);setEditP(null);setPf({name:"",description:"",price:"",stock:"",category:""});loadProds();}
    catch{notifShow("Gagal menyimpan",true);}finally{setLoad(false);}
  };
  const delProd=async(id)=>{if(!confirm("Hapus produk ini?"))return;try{await req(`/products/${id}`,{method:"DELETE"},token);notifShow("Produk dihapus!");loadProds();}catch{notifShow("Gagal menghapus",true);}};
  const updTx=async(id,status)=>{try{await req(`/transactions/${id}`,{method:"PUT",body:JSON.stringify({status})},token);notifShow("Status diperbarui!");loadTxs();}catch{notifShow("Gagal update",true);}};

  const cartQty=cart.reduce((s,i)=>s+i.qty,0);
  const cartTotal=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const fps=prods.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));

  const PCard=({p})=>(
    <div className="prod-card" onClick={()=>{setSel(p);go("detail");}}>
      <div style={{height:150,background:"#FFF3F0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:60}}>{emoji(p.category)}</div>
      <div style={{padding:"10px 12px 12px"}}>
        <div style={{fontSize:13,fontWeight:600,color:"#333",marginBottom:4,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",lineHeight:1.4,minHeight:36}}>{p.name}</div>
        <div style={{fontSize:15,fontWeight:800,color:"#EE4D2D",marginBottom:6}}>{idr(p.price)}</div>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#999",marginBottom:8}}><span>⭐ 4.8</span><span>Stok: {p.stock}</span></div>
        <button className="sk-btn" style={{width:"100%",padding:"7px",fontSize:12}} onClick={ev=>{ev.stopPropagation();addCart(p);}} disabled={p.stock===0}>{p.stock===0?"Stok Habis":"+ Keranjang"}</button>
      </div>
    </div>
  );
  const PGRID=({list})=>(<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:14}}>{list.map(p=><PCard key={p.id} p={p}/>)}</div>);
  const EmptyBox=({icon,title,sub,cta,ctaLabel})=>(
    <div style={{background:"white",borderRadius:10,border:"1px solid #eee",padding:"52px 20px",textAlign:"center"}}>
      <i className={`ti ${icon}`} style={{fontSize:52,color:"#ccc",display:"block",marginBottom:14}}></i>
      <div style={{fontSize:17,fontWeight:700,color:"#333",marginBottom:6}}>{title}</div>
      {sub&&<div style={{color:"#888",fontSize:14,marginBottom:18}}>{sub}</div>}
      {cta&&<button className="sk-btn" onClick={cta}>{ctaLabel}</button>}
    </div>
  );

  return(
  <div style={{fontFamily:"inherit",background:"#F5F5F5",minHeight:"100vh"}}>
    {notif&&<div style={{padding:"12px 20px",background:notif.err?"#EF4444":"#10B981",color:"white",fontSize:14,fontWeight:600,textAlign:"center",position:"sticky",top:0,zIndex:999}}>{notif.msg}</div>}

    <header style={{background:"#EE4D2D",padding:"11px 20px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:notif?40:0,zIndex:100,boxShadow:"0 2px 8px rgba(0,0,0,.15)"}}>
      <button onClick={()=>go("home")} style={{background:"none",border:"none",color:"white",fontSize:20,fontWeight:800,cursor:"pointer",padding:0,letterSpacing:-1,whiteSpace:"nowrap",fontFamily:"inherit"}}>ShopKu</button>
      <div style={{flex:1,display:"flex",background:"white",borderRadius:6,overflow:"hidden",maxWidth:520}}>
        <input style={{flex:1,border:"none",outline:"none",padding:"9px 14px",fontSize:14,color:"#333",fontFamily:"inherit"}} placeholder="Cari produk di ShopKu..." value={search} onChange={e=>setSearch(e.target.value)} onFocus={()=>token&&go("products")}/>
        <button style={{background:"#D13E21",border:"none",padding:"0 16px",cursor:"pointer",color:"white"}} onClick={()=>token&&go("products")}>
          <i className="ti ti-search" style={{fontSize:18}}></i>
        </button>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <button className="nav-lnk" onClick={()=>go("cart")}>
          <i className="ti ti-shopping-cart" style={{fontSize:22}}></i>
          {cartQty>0&&<span style={{position:"absolute",top:0,right:2,background:"#FFD700",color:"#333",borderRadius:"50%",width:16,height:16,fontSize:10,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}}>{cartQty}</span>}
          <span>Keranjang</span>
        </button>
        {user?<>
          <button className="nav-lnk" onClick={()=>go("orders")}><i className="ti ti-package" style={{fontSize:22}}></i><span>Pesanan</span></button>
          <button className="nav-lnk" onClick={()=>go("admin")}><i className="ti ti-settings" style={{fontSize:22}}></i><span>Admin</span></button>
          <button className="nav-lnk" onClick={doLogout} style={{color:"#FFD700",opacity:1}}><i className="ti ti-user-circle" style={{fontSize:22}}></i><span>{user.name.split(" ")[0]}</span></button>
        </>:<div style={{display:"flex",gap:8}}>
          <button style={{background:"none",border:"1.5px solid white",color:"white",padding:"7px 14px",borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}} onClick={()=>go("login")}>Masuk</button>
          <button style={{background:"white",color:"#EE4D2D",border:"none",padding:"7px 14px",borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:800,fontFamily:"inherit"}} onClick={()=>go("register")}>Daftar</button>
        </div>}
      </div>
    </header>

    <div style={{background:"#D13E21",padding:"6px 20px",display:"flex",gap:18}}>
      {["Semua","Flash Sale","Promo","Terlaris"].map(c=>(
        <button key={c} style={{background:"none",border:"none",color:"rgba(255,255,255,.85)",fontSize:13,cursor:"pointer",padding:"2px 0",fontWeight:c==="Semua"?700:400,fontFamily:"inherit"}} onClick={()=>token?go("products"):go("login")}>{c}</button>
      ))}
    </div>

    <main style={{maxWidth:1200,margin:"0 auto",padding:"18px 20px 0"}}>

    {pg==="home"&&<div>
      <div style={{background:"linear-gradient(135deg,#EE4D2D 0%,#FF7337 55%,#FFB347 100%)",borderRadius:14,padding:"40px 32px",marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center",position:"relative",overflow:"hidden"}}>
        <div style={{zIndex:1}}>
          <div style={{color:"rgba(255,255,255,.8)",fontSize:13,fontWeight:600,marginBottom:8}}>Selamat belanja di</div>
          <h1 style={{color:"white",fontSize:32,fontWeight:800,margin:"0 0 10px",lineHeight:1.2}}>ShopKu — Belanja<br/>Lebih Hemat!</h1>
          <p style={{color:"rgba(255,255,255,.85)",margin:"0 0 24px",fontSize:15}}>Jutaan produk pilihan, harga terbaik setiap hari</p>
          <button className="sk-btn" style={{background:"white",color:"#EE4D2D",fontWeight:800,padding:"13px 30px",fontSize:15}} onClick={()=>token?go("products"):go("login")}>{token?"Mulai Belanja →":"Masuk & Belanja →"}</button>
        </div>
        <div style={{fontSize:100,zIndex:1,lineHeight:1}}>🛒</div>
        <div style={{position:"absolute",right:-40,top:-40,width:200,height:200,borderRadius:"50%",background:"rgba(255,255,255,.07)"}}/>
        <div style={{position:"absolute",left:-20,bottom:-40,width:140,height:140,borderRadius:"50%",background:"rgba(255,255,255,.07)"}}/>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:16,marginBottom:20}}>
        <div style={{background:"linear-gradient(90deg,#EE4D2D,#FF7337)",borderRadius:12,padding:"18px 22px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{color:"white",fontSize:20,fontWeight:800}}>⚡ Flash Sale</div><div style={{color:"rgba(255,255,255,.85)",fontSize:13}}>Penawaran spesial hari ini!</div></div>
          <button className="sk-btn" style={{background:"white",color:"#EE4D2D",fontWeight:800}} onClick={()=>token?go("products"):go("login")}>Lihat Semua</button>
        </div>
        <div style={{background:"white",borderRadius:12,border:"1px solid #eee",padding:"18px 20px",display:"flex",alignItems:"center",gap:14}}>
          <span style={{fontSize:32}}>🎁</span>
          <div><div style={{fontWeight:700,fontSize:14,color:"#333"}}>Voucher Gratis</div><div style={{fontSize:12,color:"#888"}}>Klaim sekarang!</div></div>
        </div>
      </div>

      <div style={{background:"white",borderRadius:12,border:"1px solid #eee",padding:"18px 20px",marginBottom:20}}>
        <div style={{fontWeight:700,fontSize:16,color:"#333",marginBottom:16}}>Kategori Pilihan</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(8,1fr)",gap:10}}>
          {CATS.map(c=>(
            <button key={c.name} style={{background:"none",border:"1px solid #eee",borderRadius:10,padding:"12px 6px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:6,transition:"all .15s",fontFamily:"inherit"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor="#EE4D2D";e.currentTarget.style.background="#FFF3F0";}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor="#eee";e.currentTarget.style.background="none";}}
              onClick={()=>{setSearch(c.name);token?go("products"):go("login");}}>
              <i className={`ti ${c.icon}`} style={{fontSize:24,color:"#EE4D2D"}}></i>
              <span style={{fontSize:11,fontWeight:600,color:"#555",textAlign:"center"}}>{c.name}</span>
            </button>
          ))}
        </div>
      </div>

      <div style={{marginBottom:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontWeight:700,fontSize:16,color:"#333"}}>🔥 Produk Terbaru</div>
          {token&&prods.length>0&&<button style={{background:"none",border:"none",color:"#EE4D2D",cursor:"pointer",fontSize:14,fontWeight:600,fontFamily:"inherit"}} onClick={()=>go("products")}>Lihat Semua →</button>}
        </div>
        {!token?<div style={{background:"white",borderRadius:12,border:"1px solid #eee",padding:"52px 20px",textAlign:"center"}}>
          <i className="ti ti-lock" style={{fontSize:52,color:"#EE4D2D",display:"block",marginBottom:14}}></i>
          <div style={{fontSize:18,fontWeight:700,color:"#333",marginBottom:8}}>Login untuk melihat produk</div>
          <div style={{color:"#888",fontSize:14,marginBottom:22}}>Masuk atau daftar untuk mulai belanja</div>
          <div style={{display:"flex",gap:12,justifyContent:"center"}}>
            <button className="sk-btn" onClick={()=>go("login")}>Masuk</button>
            <button className="sk-outline" onClick={()=>go("register")}>Daftar Gratis</button>
          </div>
        </div>:prods.length===0?<EmptyBox icon="ti-package-off" title="Belum ada produk" sub="Tambahkan lewat menu Admin!" cta={()=>go("admin")} ctaLabel="Kelola Produk"/>:<PGRID list={prods.slice(0,10)}/>}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:14,marginBottom:20}}>
        {[{icon:"ti-truck",title:"Gratis Ongkir",desc:"Semua transaksi"},{icon:"ti-shield-check",title:"Transaksi Aman",desc:"Data terenkripsi"},{icon:"ti-arrow-back-up",title:"Mudah Retur",desc:"7 hari garansi"},{icon:"ti-headset",title:"CS 24/7",desc:"Siap bantu kamu"}].map(f=>(
          <div key={f.title} style={{background:"white",borderRadius:10,border:"1px solid #eee",padding:"16px 14px",textAlign:"center"}}>
            <i className={`ti ${f.icon}`} style={{fontSize:28,color:"#EE4D2D",display:"block",marginBottom:10}}></i>
            <div style={{fontWeight:700,fontSize:13,color:"#333"}}>{f.title}</div>
            <div style={{fontSize:12,color:"#888",marginTop:3}}>{f.desc}</div>
          </div>
        ))}
      </div>
    </div>}

    {pg==="products"&&<div>
      <div style={{fontWeight:700,fontSize:16,color:"#333",marginBottom:14}}>🛍️ Semua Produk <span style={{color:"#999",fontSize:14,fontWeight:400}}>({fps.length} produk)</span></div>
      <div style={{background:"white",border:"1px solid #ddd",borderRadius:8,padding:"9px 14px",marginBottom:16,display:"flex",alignItems:"center",gap:10}}>
        <i className="ti ti-search" style={{fontSize:18,color:"#aaa"}}></i>
        <input style={{flex:1,border:"none",outline:"none",fontSize:14,fontFamily:"inherit"}} placeholder="Cari produk..." value={search} onChange={e=>setSearch(e.target.value)}/>
        {search&&<button style={{background:"none",border:"none",cursor:"pointer",color:"#EE4D2D",fontSize:13,fontWeight:600,fontFamily:"inherit"}} onClick={()=>setSearch("")}>✕ Reset</button>}
      </div>
      {fps.length===0?<EmptyBox icon="ti-search-off" title={`Tidak ditemukan "${search}"`} sub="Coba kata kunci lain"/>:<PGRID list={fps}/>}
    </div>}

    {pg==="detail"&&sel&&<div style={{maxWidth:720,margin:"0 auto"}}>
      <button style={{background:"none",border:"1px solid #ddd",color:"#666",padding:"7px 16px",borderRadius:6,cursor:"pointer",fontSize:13,marginBottom:18,fontFamily:"inherit"}} onClick={()=>go("products")}><i className="ti ti-arrow-left"></i> Kembali</button>
      <div style={{background:"white",borderRadius:12,border:"1px solid #eee",padding:24,display:"flex",gap:24}}>
        <div style={{width:210,height:210,background:"#FFF3F0",borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:80,flexShrink:0}}>{emoji(sel.category)}</div>
        <div style={{flex:1}}>
          <div style={{fontSize:20,fontWeight:700,color:"#333",marginBottom:10,lineHeight:1.3}}>{sel.name}</div>
          <div style={{display:"flex",gap:3,marginBottom:14}}>{[...Array(5)].map((_,i)=><span key={i} style={{color:"#FFD700",fontSize:16}}>★</span>)}<span style={{fontSize:13,color:"#888",marginLeft:6}}>4.8 (120 ulasan)</span></div>
          <div style={{fontSize:28,fontWeight:800,color:"#EE4D2D",marginBottom:16}}>{idr(sel.price)}</div>
          {sel.description&&<div style={{color:"#666",fontSize:14,lineHeight:1.7,marginBottom:16}}>{sel.description}</div>}
          <div style={{display:"flex",gap:12,marginBottom:22}}>
            <div style={{background:"#FFF3F0",borderRadius:8,padding:"10px 16px"}}><div style={{fontSize:11,color:"#888"}}>Stok</div><div style={{fontWeight:800,color:"#EE4D2D"}}>{sel.stock} tersisa</div></div>
            <div style={{background:"#f5f5f5",borderRadius:8,padding:"10px 16px"}}><div style={{fontSize:11,color:"#888"}}>Kategori</div><div style={{fontWeight:700,color:"#333"}}>{sel.category||"Umum"}</div></div>
          </div>
          <button className="sk-btn" style={{padding:"12px 30px",fontSize:15}} onClick={()=>addCart(sel)} disabled={sel.stock===0}><i className="ti ti-shopping-cart-plus"></i>  {sel.stock===0?"Stok Habis":"Tambah ke Keranjang"}</button>
        </div>
      </div>
    </div>}

    {pg==="cart"&&<div style={{maxWidth:720,margin:"0 auto"}}>
      <div style={{fontWeight:700,fontSize:16,color:"#333",marginBottom:16}}>🛒 Keranjang Belanja</div>
      {cart.length===0?<EmptyBox icon="ti-shopping-cart-off" title="Keranjang kosong" sub="Yuk, tambahkan produk!" cta={()=>go("products")} ctaLabel="Mulai Belanja"/>:<>
        <div style={{background:"white",borderRadius:12,border:"1px solid #eee",marginBottom:14,overflow:"hidden"}}>
          {cart.map((it,i)=>(
            <div key={it.id} style={{display:"flex",alignItems:"center",gap:16,padding:"16px 20px",borderBottom:i<cart.length-1?"1px solid #f5f5f5":"none"}}>
              <div style={{width:58,height:58,background:"#FFF3F0",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,flexShrink:0}}>{emoji(it.category)}</div>
              <div style={{flex:1}}><div style={{fontWeight:600,color:"#333",fontSize:14}}>{it.name}</div><div style={{color:"#EE4D2D",fontWeight:800,fontSize:14,marginTop:2}}>{idr(it.price)}</div></div>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <button style={{width:28,height:28,border:"1px solid #ddd",borderRadius:6,background:"none",cursor:"pointer",fontWeight:700,fontSize:16,fontFamily:"inherit"}} onClick={()=>setQty(it.id,it.qty-1)}>-</button>
                <span style={{fontWeight:700,minWidth:22,textAlign:"center"}}>{it.qty}</span>
                <button style={{width:28,height:28,border:"1px solid #EE4D2D",borderRadius:6,background:"#EE4D2D",cursor:"pointer",fontWeight:700,color:"white",fontSize:16,fontFamily:"inherit"}} onClick={()=>setQty(it.id,it.qty+1)}>+</button>
              </div>
              <div style={{fontWeight:800,color:"#333",minWidth:90,textAlign:"right",fontSize:14}}>{idr(it.price*it.qty)}</div>
              <button style={{background:"#FEE2E2",border:"none",borderRadius:6,padding:"7px 10px",cursor:"pointer",color:"#991B1B"}} onClick={()=>remCart(it.id)}><i className="ti ti-trash" style={{fontSize:16}}></i></button>
            </div>
          ))}
        </div>
        <div style={{background:"white",borderRadius:12,border:"1px solid #eee",padding:"16px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontSize:13,color:"#888"}}>Total ({cartQty} item)</div><div style={{fontSize:24,fontWeight:800,color:"#EE4D2D"}}>{idr(cartTotal)}</div></div>
          <button className="sk-btn" style={{padding:"12px 36px",fontSize:15}} onClick={checkout} disabled={loading||!user}>{loading?"Memproses...":!user?"Login dulu":"Checkout →"}</button>
        </div>
        {!user&&<div style={{textAlign:"center",marginTop:10,fontSize:13,color:"#888"}}><button style={{color:"#EE4D2D",background:"none",border:"none",cursor:"pointer",fontWeight:700,fontFamily:"inherit"}} onClick={()=>go("login")}>Login</button> untuk checkout</div>}
      </>}
    </div>}

    {pg==="orders"&&<div style={{maxWidth:720,margin:"0 auto"}}>
      <div style={{fontWeight:700,fontSize:16,color:"#333",marginBottom:16}}>📦 Pesanan Saya</div>
      {txs.length===0?<EmptyBox icon="ti-receipt-off" title="Belum ada pesanan" cta={()=>go("products")} ctaLabel="Mulai Belanja"/>:
      txs.map(t=>(
        <div key={t.id} style={{background:"white",borderRadius:12,border:"1px solid #eee",padding:"16px 20px",marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",gap:14,alignItems:"center"}}>
            <div style={{width:52,height:52,background:"#FFF3F0",borderRadius:8,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>{emoji(t.product?.category)}</div>
            <div>
              <div style={{fontWeight:700,color:"#333",fontSize:14}}>{t.product?.name||"Produk"}</div>
              <div style={{fontSize:12,color:"#888",marginTop:2}}>{t.quantity} pcs • {new Date(t.created_at).toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"})}</div>
              <div style={{fontWeight:800,color:"#EE4D2D",marginTop:4,fontSize:14}}>{idr(t.total_price)}</div>
            </div>
          </div>
          <span className={t.status==="pending"?"sp":t.status==="success"?"ss":"sc"}>{t.status==="pending"?"⏳ Menunggu":t.status==="success"?"✅ Selesai":"❌ Batal"}</span>
        </div>
      ))}
    </div>}

    {pg==="login"&&<div style={{maxWidth:390,margin:"28px auto"}}>
      <div style={{background:"white",borderRadius:14,border:"1px solid #eee",padding:28,boxShadow:"0 4px 20px rgba(0,0,0,.06)"}}>
        <div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:36,marginBottom:10}}>👋</div><div style={{fontSize:20,fontWeight:800,color:"#333"}}>Selamat Datang!</div><div style={{color:"#888",fontSize:14}}>Masuk ke akun ShopKu kamu</div></div>
        {afErr&&<div style={{background:"#FEE2E2",color:"#991B1B",padding:"10px 14px",borderRadius:8,marginBottom:16,fontSize:13,fontWeight:600}}>{afErr}</div>}
        <form onSubmit={doLogin}>
          <div style={{marginBottom:14}}><label>Email</label><input className="fi" type="email" placeholder="email@kamu.com" value={af.email} onChange={e=>setAf(p=>({...p,email:e.target.value}))} required/></div>
          <div style={{marginBottom:20}}><label>Password</label><input className="fi" type="password" placeholder="••••••••" value={af.password} onChange={e=>setAf(p=>({...p,password:e.target.value}))} required/></div>
          <button className="sk-btn" style={{width:"100%",padding:"12px",fontSize:15}} type="submit" disabled={loading}>{loading?"Memproses...":"Masuk"}</button>
        </form>
        <div style={{textAlign:"center",marginTop:16,fontSize:14,color:"#888"}}>Belum punya akun? <button style={{color:"#EE4D2D",background:"none",border:"none",cursor:"pointer",fontWeight:700,fontFamily:"inherit"}} onClick={()=>go("register")}>Daftar Gratis</button></div>
      </div>
    </div>}

    {pg==="register"&&<div style={{maxWidth:390,margin:"28px auto"}}>
      <div style={{background:"white",borderRadius:14,border:"1px solid #eee",padding:28,boxShadow:"0 4px 20px rgba(0,0,0,.06)"}}>
        <div style={{textAlign:"center",marginBottom:24}}><div style={{fontSize:36,marginBottom:10}}>🎉</div><div style={{fontSize:20,fontWeight:800,color:"#333"}}>Buat Akun Baru</div><div style={{color:"#888",fontSize:14}}>Daftar gratis & mulai belanja</div></div>
        {afErr&&<div style={{background:"#FEE2E2",color:"#991B1B",padding:"10px 14px",borderRadius:8,marginBottom:16,fontSize:13,fontWeight:600}}>{afErr}</div>}
        <form onSubmit={doReg}>
          {[{k:"name",l:"Nama Lengkap",t:"text",ph:"Nama kamu"},{k:"email",l:"Email",t:"email",ph:"email@kamu.com"},{k:"password",l:"Password",t:"password",ph:"Min. 8 karakter"},{k:"password_confirmation",l:"Konfirmasi Password",t:"password",ph:"Ulangi password"}].map(f=>(
            <div key={f.k} style={{marginBottom:14}}><label>{f.l}</label><input className="fi" type={f.t} placeholder={f.ph} value={af[f.k]} onChange={e=>setAf(p=>({...p,[f.k]:e.target.value}))} required/></div>
          ))}
          <button className="sk-btn" style={{width:"100%",padding:"12px",fontSize:15,marginTop:4}} type="submit" disabled={loading}>{loading?"Memproses...":"Daftar Sekarang"}</button>
        </form>
        <div style={{textAlign:"center",marginTop:16,fontSize:14,color:"#888"}}>Sudah punya akun? <button style={{color:"#EE4D2D",background:"none",border:"none",cursor:"pointer",fontWeight:700,fontFamily:"inherit"}} onClick={()=>go("login")}>Masuk</button></div>
      </div>
    </div>}

    {pg==="admin"&&<div>
      <div style={{fontWeight:700,fontSize:16,color:"#333",marginBottom:16}}>⚙️ Panel Admin</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14,marginBottom:20}}>
        {[{l:"Total Produk",v:prods.length,icon:"ti-box",bg:"#FFF3F0",c:"#EE4D2D"},{l:"Total Users",v:users.length,icon:"ti-users",bg:"#EEF2FF",c:"#4F46E5"},{l:"Total Transaksi",v:txs.length,icon:"ti-receipt",bg:"#F0FDF4",c:"#16A34A"}].map(c=>(
          <div key={c.l} style={{background:"white",borderRadius:10,border:"1px solid #eee",padding:"16px 20px",display:"flex",alignItems:"center",gap:16}}>
            <div style={{width:48,height:48,borderRadius:10,background:c.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <i className={`ti ${c.icon}`} style={{fontSize:24,color:c.c}}></i>
            </div>
            <div><div style={{fontSize:12,color:"#888"}}>{c.l}</div><div style={{fontSize:28,fontWeight:800,color:"#333"}}>{c.v}</div></div>
          </div>
        ))}
      </div>
      <div style={{display:"flex",gap:4,marginBottom:16,background:"white",borderRadius:8,border:"1px solid #eee",padding:4,width:"fit-content"}}>
        {[{k:"products",l:"📦 Produk"},{k:"users",l:"👥 Users"},{k:"transactions",l:"🧾 Transaksi"}].map(t=>(
          <button key={t.k} className={`tab-btn ${atab===t.k?"tab-on":"tab-off"}`} style={{fontFamily:"inherit"}} onClick={()=>setAtab(t.k)}>{t.l}</button>
        ))}
      </div>

      {atab==="products"&&<div style={{background:"white",borderRadius:10,border:"1px solid #eee",overflow:"hidden"}}>
        <div style={{padding:"16px 20px",borderBottom:"1px solid #eee",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:700,color:"#333"}}>Daftar Produk ({prods.length})</div>
          <button className="sk-btn" style={{display:"flex",alignItems:"center",gap:6,fontSize:13}} onClick={()=>{setEditP(null);setPf({name:"",description:"",price:"",stock:"",category:""});setShowForm(true);}}>
            <i className="ti ti-plus"></i> Tambah Produk
          </button>
        </div>
        {showForm&&<div style={{padding:"16px 20px",background:"#FFF8F7",borderBottom:"1px solid #eee"}}>
          <div style={{fontWeight:700,color:"#333",marginBottom:14}}>{editP?"✏️ Edit Produk":"➕ Produk Baru"}</div>
          <form onSubmit={saveProd}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              {[{k:"name",l:"Nama Produk",ph:"Nama produk"},{k:"category",l:"Kategori",ph:"Elektronik, Fashion..."},{k:"price",l:"Harga (Rp)",ph:"1500000",t:"number"},{k:"stock",l:"Stok",ph:"50",t:"number"}].map(f=>(
                <div key={f.k}><label>{f.l}</label><input className="fi" type={f.t||"text"} placeholder={f.ph} value={pf[f.k]} onChange={e=>setPf(p=>({...p,[f.k]:e.target.value}))} required={f.k!=="category"}/></div>
              ))}
            </div>
            <div style={{marginBottom:14}}><label>Deskripsi</label><textarea className="fi" placeholder="Deskripsi produk..." value={pf.description} onChange={e=>setPf(p=>({...p,description:e.target.value}))}/></div>
            <div style={{display:"flex",gap:8}}>
              <button className="sk-btn" type="submit" disabled={loading} style={{fontFamily:"inherit"}}>{loading?"Menyimpan...":"💾 Simpan"}</button>
              <button className="sk-outline" type="button" style={{fontFamily:"inherit"}} onClick={()=>setShowForm(false)}>Batal</button>
            </div>
          </form>
        </div>}
        <div style={{overflowX:"auto"}}>
          <table><thead><tr>{["ID","Nama","Kategori","Harga","Stok","Aksi"].map(h=><th key={h}>{h}</th>)}</tr></thead>
          <tbody>{prods.map(p=>(
            <tr key={p.id}>
              <td style={{color:"#999",fontSize:12}}>#{p.id}</td>
              <td style={{fontWeight:600}}>{p.name}</td>
              <td>{p.category&&<span style={{background:"#f5f5f5",padding:"2px 10px",borderRadius:20,fontSize:11,color:"#666"}}>{p.category}</span>}</td>
              <td style={{fontWeight:800,color:"#EE4D2D"}}>{idr(p.price)}</td>
              <td style={{fontWeight:700,color:p.stock<5?"#EE4D2D":"#16A34A"}}>{p.stock}</td>
              <td><div style={{display:"flex",gap:6}}>
                <button style={{background:"#EFF6FF",border:"none",color:"#1D4ED8",padding:"5px 11px",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}} onClick={()=>{setEditP(p);setPf({name:p.name,description:p.description||"",price:p.price,stock:p.stock,category:p.category||""});setShowForm(true);}}>✏️ Edit</button>
                <button style={{background:"#FEE2E2",border:"none",color:"#991B1B",padding:"5px 11px",borderRadius:6,cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"inherit"}} onClick={()=>delProd(p.id)}>🗑 Hapus</button>
              </div></td>
            </tr>
          ))}</tbody></table>
          {prods.length===0&&<div style={{textAlign:"center",padding:36,color:"#aaa"}}>Belum ada produk. Tambahkan sekarang!</div>}
        </div>
      </div>}

      {atab==="users"&&<div style={{background:"white",borderRadius:10,border:"1px solid #eee",overflow:"hidden"}}>
        <div style={{padding:"16px 20px",borderBottom:"1px solid #eee",fontWeight:700,color:"#333"}}>Daftar Users ({users.length})</div>
        <table><thead><tr>{["User","Email","Bergabung"].map(h=><th key={h}>{h}</th>)}</tr></thead>
        <tbody>{users.map(u=>(
          <tr key={u.id}>
            <td><div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:34,height:34,borderRadius:"50%",background:"#EE4D2D",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:800,fontSize:13,flexShrink:0}}>{u.name[0].toUpperCase()}</div>
              <span style={{fontWeight:600}}>{u.name}</span>
            </div></td>
            <td style={{color:"#666"}}>{u.email}</td>
            <td style={{color:"#999",fontSize:12}}>{new Date(u.created_at).toLocaleDateString("id-ID")}</td>
          </tr>
        ))}</tbody></table>
        {users.length===0&&<div style={{textAlign:"center",padding:36,color:"#aaa"}}>Belum ada user</div>}
      </div>}

      {atab==="transactions"&&<div style={{background:"white",borderRadius:10,border:"1px solid #eee",overflow:"hidden"}}>
        <div style={{padding:"16px 20px",borderBottom:"1px solid #eee",fontWeight:700,color:"#333"}}>Semua Transaksi ({txs.length})</div>
        <div style={{overflowX:"auto"}}>
          <table><thead><tr>{["ID","User","Produk","Qty","Total","Status","Ubah Status"].map(h=><th key={h} style={{whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
          <tbody>{txs.map(t=>(
            <tr key={t.id}>
              <td style={{color:"#999",fontSize:12}}>#{t.id}</td>
              <td>{t.user?.name||"-"}</td>
              <td style={{fontWeight:600}}>{t.product?.name||"-"}</td>
              <td>{t.quantity}</td>
              <td style={{fontWeight:800,color:"#EE4D2D"}}>{idr(t.total_price)}</td>
              <td><span className={t.status==="pending"?"sp":t.status==="success"?"ss":"sc"}>{t.status}</span></td>
              <td>
                <select className="fi" style={{padding:"5px 10px",fontSize:12,width:"auto",minWidth:110,fontFamily:"inherit"}} value={t.status} onChange={e=>updTx(t.id,e.target.value)}>
                  <option value="pending">pending</option><option value="success">success</option><option value="cancelled">cancelled</option>
                </select>
              </td>
            </tr>
          ))}</tbody></table>
          {txs.length===0&&<div style={{textAlign:"center",padding:36,color:"#aaa"}}>Belum ada transaksi</div>}
        </div>
      </div>}
    </div>}

    </main>

    <footer style={{background:"#1A1A1A",color:"#888",padding:"32px 20px 20px",marginTop:48}}>
      <div style={{maxWidth:1200,margin:"0 auto"}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr",gap:24,marginBottom:24}}>
          <div><div style={{color:"white",fontWeight:800,fontSize:20,marginBottom:10}}>ShopKu</div><div style={{fontSize:13,lineHeight:1.7}}>Platform belanja online terpercaya dengan jutaan produk pilihan harga terbaik.</div></div>
          {[{t:"Belanja",i:["Semua Produk","Flash Sale","Promo"]},{t:"Bantuan",i:["Cara Beli","Cara Bayar","Retur"]},{t:"Perusahaan",i:["Tentang Kami","Karir","Blog"]}].map(col=>(
            <div key={col.t}><div style={{color:"white",fontWeight:700,fontSize:14,marginBottom:10}}>{col.t}</div>{col.i.map(i=><div key={i} style={{fontSize:13,marginBottom:6,cursor:"pointer"}}>{i}</div>)}</div>
          ))}
        </div>
        <div style={{borderTop:"1px solid #333",paddingTop:16,textAlign:"center",fontSize:12}}>© 2025 ShopKu — Dibangun dengan Laravel + Sanctum API</div>
      </div>
    </footer>
  </div>
  );
}
ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
